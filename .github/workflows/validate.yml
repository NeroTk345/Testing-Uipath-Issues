name: Validate files

# Runs on every push and pull request.
# - Every .json file must be valid JSON (configuration files must never break PROD).
# - Every .yml / .yaml file must be valid YAML (issue forms, workflows, labels).
# - Blocks obvious secrets (tokens, passwords, private IP addresses) from being committed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Validate JSON files
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          files = subprocess.run(["git", "ls-files", "*.json"], capture_output=True, text=True).stdout.split()
          errors = 0
          for f in files:
              try:
                  with open(f, encoding="utf-8-sig") as fh:
                      json.load(fh)
                  print(f"OK    {f}")
              except Exception as e:
                  errors += 1
                  print(f"::error file={f}::Invalid JSON: {e}")
          print(f"\nChecked {len(files)} JSON file(s), {errors} error(s).")
          sys.exit(1 if errors else 0)
          EOF

      - name: Validate YAML files
        run: |
          python - <<'EOF'
          import subprocess, sys, yaml
          files = subprocess.run(["git", "ls-files", "*.yml", "*.yaml"], capture_output=True, text=True).stdout.split()
          errors = 0
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
                  print(f"OK    {f}")
              except Exception as e:
                  errors += 1
                  print(f"::error file={f}::Invalid YAML: {e}")
          print(f"\nChecked {len(files)} YAML file(s), {errors} error(s).")
          sys.exit(1 if errors else 0)
          EOF

      - name: Check for secrets
        run: |
          python - <<'EOF'
          import re, subprocess, sys
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          patterns = {
              "private IP address": re.compile(r"\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b"),
              "password assignment": re.compile(r"(?i)\bpassword\s*[:=]\s*\S{4,}"),
              "bearer token": re.compile(r"(?i)bearer\s+[a-z0-9\-_\.]{20,}"),
              "client secret": re.compile(r"(?i)client[_ ]?secret\s*[:=]\s*\S{8,}"),
          }
          skip = (".github/workflows/validate.yml",)
          found = 0
          for f in files:
              if f in skip:
                  continue
              try:
                  text = open(f, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  for name, pat in patterns.items():
                      if pat.search(line):
                          found += 1
                          print(f"::error file={f},line={n}::Possible {name} found. Remove it before merging.")
          print(f"\nScanned {len(files)} file(s), {found} finding(s).")
          sys.exit(1 if found else 0)
          EOF
