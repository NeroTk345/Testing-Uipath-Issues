name: Question
description: Ask how something works or how to do something
title: "[Question] "
labels: ["question"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - DattoRMM
        - NOC
        - Not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Do not include tokens or customer names.
